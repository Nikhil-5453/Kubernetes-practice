apiVersion: v1
kind: Service
metadata:
  name: sidecar-demo-svc        # -> Name of the service
spec:
  # type: NodePort
  selector:
    app: sidecar               # -> Label selector to match the pods created by the deployment
  ports:
    - protocol: TCP
      port: 80                 # -> Port on which the service will be exposed  
      targetPort: 3000         # -> Port on the pod to which the service will forward requests